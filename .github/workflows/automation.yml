name: Drapewell Complete Automation

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run Drapewell Automation
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          CJ_API_TOKEN: ${{ secrets.CJ_API_TOKEN }}
        run: |
          python main.py
      
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: automation-report
          path: drapewell_automation_report.json
          retention-days: 30
