name: Drapewell Automation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - run: pip install requests
      
      - name: Run automation
        run: python main.py
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-results
          path: |
            drapewell_sync_report.txt
            drapewell_products_synced.json
