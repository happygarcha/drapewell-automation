name: Create Drapewell Pages

on:
  workflow_dispatch:

jobs:
  create-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python3 create_pages.py
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-report
          path: pages_creation_report.txt
