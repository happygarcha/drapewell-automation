name: Search Console report

# Every Monday, and on demand. Reads the key from the repository secret GSC_SERVICE_ACCOUNT_JSON.
# Output: the run summary and a downloadable artifact. Nothing is committed.
on:
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:
    inputs:
      min_impressions:
        description: "Minimum impressions per query"
        default: "50"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Build report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          MIN_IMPR: ${{ inputs.min_impressions || '50' }}
        run: |
          python scripts/gsc_report.py --min-impr "$MIN_IMPR" --out out/gsc-opportunities.md
          cat out/gsc-opportunities.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-opportunities
          path: out/gsc-opportunities.md
          retention-days: 90
