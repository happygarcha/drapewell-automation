name: Deploy storefront to GitHub Pages

# Publishes discover/ (the dark dashboard) at the root and site/ (the calm lookbook) at /lookbook/.
# Also packages theme/ as drapewell-discover-theme.zip (a Shopify theme you can import from this URL).
# Static files only: no secrets, no Shopify or CJ calls from the workflow.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "discover/**"
      - "theme/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/lookbook
          cp -r discover/. _site/
          cp -r site/. _site/lookbook/
          (cd theme && zip -qr ../_site/drapewell-discover-theme.zip . -x '.*')
          cp -r theme _site/theme-src
          touch _site/.nojekyll
          echo "Files in _site:" && find _site -type f | wc -l

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
