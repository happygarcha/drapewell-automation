<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item | Drapewell</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body data-page="product">
<header class="mast">
  <a class="wordmark" href="index.html">Drapewell<small>General catalog</small></a>
  <a class="cart-link" href="#" aria-label="Cart">Cart <span class="cart-count">0</span></a>
</header>

<p class="crumb"><a href="index.html">Catalog</a> / <a id="crumb-dept" href="index.html"></a> / <span id="crumb-name"></span></p>

<main class="book">
  <div class="page">
    <div class="pdp">
      <div class="plate" id="plate"></div>
      <div class="pdp-info">
        <span class="item-no" id="no"></span>
        <h1 id="title"></h1>
        <p class="lede" id="lede"></p>
        <p class="price">Price not set in this mockup.</p>

        <div class="group" id="opt-group">
          <h2 id="opt-h"></h2>
          <fieldset class="opts" id="opts" aria-labelledby="opt-h"></fieldset>
        </div>

        <div class="group">
          <h2 id="qty-h">Quantity</h2>
          <div class="stepper" role="group" aria-labelledby="qty-h">
            <button type="button" id="less" aria-label="Fewer">−</button>
            <output id="qty" aria-live="polite">1</output>
            <button type="button" id="more" aria-label="More">+</button>
          </div>
        </div>

        <div>
          <button class="btn" id="add" type="button">Add to cart</button>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
    <section class="also" aria-labelledby="also-h">
      <h2 id="also-h">Also on this page of the catalog</h2>
      <div id="also"></div>
    </section>
  </div>
</main>

<footer class="foot">
  <p>Design mockup. Item names, specifications and options are placeholders; prices, stock and delivery are not set. Nothing here places an order.</p>
</footer>
</body>
</html>
