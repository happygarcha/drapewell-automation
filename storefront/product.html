<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drapes | Drapewell</title>
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body data-page="product">
<header class="bar">
  <a class="wordmark" href="index.html">Drapewell</a>
  <nav aria-label="Main">
    <a href="index.html">Drapes</a>
    <a class="cart-link" href="#" aria-label="Cart">Cart <span class="cart-count">0</span></a>
  </nav>
</header>

<p class="crumb"><a href="index.html">Drapes</a> / <span id="crumb-name"></span></p>

<main class="product">
  <div class="bolt" id="bolt"></div>

  <div class="buy">
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <p class="price-line">Price not set in this mockup.</p>

    <div class="panel-box">
      <h2 id="drop-h">Drop length, in</h2>
      <fieldset class="drops" id="drops" aria-labelledby="drop-h"></fieldset>
      <p class="hint" id="fit-hint"></p>
    </div>

    <div class="panel-box">
      <h2 id="panels-h">Panels</h2>
      <div class="stepper" role="group" aria-labelledby="panels-h">
        <button type="button" id="less" aria-label="Fewer panels">−</button>
        <output id="panels" aria-live="polite">2</output>
        <button type="button" id="more" aria-label="More panels">+</button>
      </div>
      <p class="hint" id="total-width"></p>
    </div>

    <div>
      <button class="btn" id="add" type="button" disabled aria-disabled="true">Add to cart</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <dl class="specs" id="specs"></dl>
  </div>
</main>

<footer class="foot">
  <p>Design mockup. Fabric names, specifications and sizes are placeholders; prices, stock and delivery are not set. Nothing here places an order.</p>
</footer>
</body>
</html>
